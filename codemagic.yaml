workflows:
  android-debug-build:
    name: Metrolist - Tuinity
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.welcome.provider.enabled=false -Dorg.gradle.jvmargs=-Xmx4g"
        KOTLIN_DAEMON_JVM_ARGS: "-Xmx4g"
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
